<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-label="Estúdio de Instrumentos Convertidos — fluxo completo"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8d34a"/></marker></defs><rect x="0" y="0" width="1120" height="640" rx="0" fill="#0e1014" stroke="#0e1014" stroke-width="0"/><rect x="28" y="24" width="1064" height="66" rx="12" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="50" y="52" fill="#e7ebf2" font-size="21" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Estúdio de Instrumentos Convertidos (v0.2.21)</text><text x="50" y="76" fill="#98a3b3" font-size="12.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Converter → reabrir → editar samples/zonas → salvar → tocar com teclado USB MIDI → reabrir depois.</text><rect x="915" y="40" width="155" height="30" rx="15" fill="#2d2918" stroke="#e8d34a" stroke-width="1"/><text x="993" y="60" fill="#e8d34a" font-size="11" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">ESTÚDIO</text><rect x="70" y="130" width="300" height="200" rx="14" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="94" y="162" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">1 · INSTRUMENTOS CONVERTIDOS</text><text x="94" y="196" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Botão mostra/oculta a lista</text><text x="94" y="224" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Todo .mrq convertido entra</text><text x="94" y="252" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">automaticamente na lista</text><text x="94" y="280" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Lista salva no computador:</text><text x="94" y="308" fill="#54c9ef" font-size="12" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">reabra quando quiser</text><line x1="372" y1="230" x2="450" y2="230" stroke="#e8d34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="452" y="130" width="300" height="200" rx="14" fill="#173b4a" stroke="#54c9ef" stroke-width="2"/><text x="476" y="162" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">2 · EDITOR DE SAMPLES</text><text x="476" y="196" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Lista de samples + waveform</text><text x="476" y="224" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Trim: cortar início/fim</text><text x="476" y="252" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Auto-trim de silêncio</text><text x="476" y="280" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Zonas: root, teclas, velocity,</text><text x="476" y="308" fill="#54c9ef" font-size="12" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">volume, pan, afinação, loop</text><line x1="754" y1="230" x2="832" y2="230" stroke="#e8d34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="834" y="130" width="220" height="200" rx="14" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="858" y="162" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">3 · SALVAR</text><text x="858" y="196" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Salvar no mesmo arquivo</text><text x="858" y="224" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">ou Salvar como…</text><text x="858" y="252" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Samples sem trim são</text><text x="858" y="280" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">copiados byte a byte</text><text x="858" y="308" fill="#54c9ef" font-size="12" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">(sem recomprimir)</text><rect x="70" y="370" width="984" height="120" rx="14" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="94" y="402" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">4 · ESTÚDIO DE TESTE MIDI — tocar com o teclado USB e conferir o timbre</text><text x="94" y="434" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Conectar MIDI (Web MIDI) → teclado USB aparece na lista → toque e ouça o instrumento convertido.</text><text x="94" y="460" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Teclado na tela também funciona. Sem teclado USB? Use as teclas do computador.</text><rect x="70" y="520" width="984" height="66" rx="10" fill="#20252e" stroke="#343b47" stroke-width="1"/><text x="92" y="548" fill="#e7ebf2" font-size="12.5" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">O instrumento salvo pode ser reaberto depois: pela lista INSTRUMENTOS CONVERTIDOS ou pelo botão Abrir .mrq do Estúdio.</text><text x="92" y="570" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Edições não salvas mostram um aviso antes de fechar — nada se perde sem você confirmar.</text></svg>