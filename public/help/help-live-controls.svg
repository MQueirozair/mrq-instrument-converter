<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-label="Controles ao Vivo — controles globais do instrumento inteiro"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8d34a"/></marker></defs><rect x="0" y="0" width="1120" height="640" rx="0" fill="#0e1014" stroke="#0e1014" stroke-width="0"/><rect x="28" y="24" width="1064" height="66" rx="12" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="50" y="52" fill="#e7ebf2" font-size="21" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Controles ao Vivo (v0.2.22)</text><text x="50" y="76" fill="#98a3b3" font-size="12.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Controles globais do instrumento inteiro + pré-escuta do som final, como vai sair no rack ao vivo.</text><rect x="915" y="40" width="155" height="30" rx="15" fill="#2d2918" stroke="#e8d34a" stroke-width="1"/><text x="993" y="60" fill="#e8d34a" font-size="11" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">AO VIVO</text><rect x="70" y="130" width="300" height="190" rx="14" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="94" y="162" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">1 · FAIXA / RAIZ</text><text x="94" y="196" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">NOTA MIN / NOTA MAX</text><text x="94" y="224" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">TECLA RAIZ (afinação original)</text><text x="94" y="252" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">VELOCIDADE MIN / MAX</text><text x="94" y="288" fill="#54c9ef" font-size="12" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Valem pra todas as amostras</text><line x1="372" y1="225" x2="450" y2="225" stroke="#e8d34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="452" y="130" width="300" height="190" rx="14" fill="#173b4a" stroke="#54c9ef" stroke-width="2"/><text x="476" y="162" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">2 · TIMBRE (knobs)</text><text x="476" y="196" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">VOLUME dB · PAN · AFINACAO cents</text><text x="476" y="224" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">ATAQUE ms · RELEASE ms · SUSTAIN %</text><text x="476" y="252" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">EQ GRAVES / MEDIOS / AGUDOS dB</text><text x="476" y="280" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">DRIVE dB</text><text x="476" y="308" fill="#54c9ef" font-size="12" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Mexa enquanto toca — ouve na hora</text><line x1="754" y1="225" x2="832" y2="225" stroke="#e8d34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="834" y="130" width="220" height="190" rx="14" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="858" y="162" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">3 · EFEITOS</text><text x="858" y="196" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">REVERB + TAMANHO/DAMP/</text><text x="858" y="224" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">PRE-DELAY/COR</text><text x="858" y="252" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">STEREO · DELAY + TEMPO/</text><text x="858" y="280" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">FEEDBACK · CHORUS +</text><text x="858" y="308" fill="#54c9ef" font-size="12" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">RATE/DEPTH</text><rect x="70" y="360" width="984" height="110" rx="14" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="94" y="392" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">4 · TOCAR E OUVIR O SOM FINAL</text><text x="94" y="424" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Teclado na tela · teclas do computador (A = tecla raiz) · teclado USB MIDI (Conectar MIDI)</text><text x="94" y="450" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Os ajustes ficam salvos automaticamente pra cada instrumento — reabra depois e está tudo lá.</text><rect x="70" y="500" width="984" height="86" rx="10" fill="#20252e" stroke="#343b47" stroke-width="1"/><text x="92" y="528" fill="#e7ebf2" font-size="12.5" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Onde abrir: botão "Controles ao Vivo" ao lado do "Editar mapeamento" (Conversor), no Estúdio, ou no ícone de sliders da barra lateral.</text><text x="92" y="552" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">Knobs: arraste pra cima/baixo, roda do mouse, setas do teclado. Duplo-clique volta ao padrão.</text></svg>