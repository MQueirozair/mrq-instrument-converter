<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-label="Escolha direta dos formatos .mrq, .sf2 e .sf3 no Conversor">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8d34a"/></marker>
</defs>
<rect width="1120" height="420" rx="0" fill="#0e1014"/>
<rect x="24" y="20" width="1072" height="60" rx="12" fill="#191d24" stroke="#343b47"/>
<text x="48" y="48" fill="#e7ebf2" font-size="20" font-weight="800" font-family="DejaVu Sans, Arial, sans-serif">Escolha o formato de saída — .mrq / .sf2 / .sf3</text>
<text x="48" y="70" fill="#98a3b3" font-size="12" font-family="DejaVu Sans, Arial, sans-serif">v0.2.16: os três botões ficam habilitados no item PRONTO; SoundFont salva direto, sem gerar .mrq antes.</text>

<rect x="30" y="106" width="510" height="170" rx="12" fill="#171a20" stroke="#4b3540" stroke-width="2"/>
<text x="52" y="136" fill="#ff8a9c" font-size="14" font-weight="800" font-family="DejaVu Sans, Arial, sans-serif">ANTES — só .mrq habilitado</text>
<text x="52" y="158" fill="#98a3b3" font-size="11" font-family="DejaVu Sans, Arial, sans-serif">SF2/SF3 ficavam cinzas até você salvar um .mrq primeiro.</text>
<rect x="52" y="184" width="148" height="40" rx="7" fill="#e8b52d" stroke="#ffe48a"/>
<text x="126" y="209" fill="#17140a" font-size="12" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Converter .mrq</text>
<rect x="212" y="184" width="138" height="40" rx="7" fill="#24272e" stroke="#3c4149"/>
<text x="281" y="209" fill="#6d7787" font-size="12" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Exportar .sf2</text>
<rect x="362" y="184" width="138" height="40" rx="7" fill="#24272e" stroke="#3c4149"/>
<text x="431" y="209" fill="#6d7787" font-size="12" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Exportar .sf3</text>
<text x="52" y="252" fill="#ff8a9c" font-size="11" font-family="DejaVu Sans, Arial, sans-serif">✕ Não dava para escolher o formato desejado</text>

<line x1="548" y1="190" x2="580" y2="190" stroke="#e8d34a" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="592" y="106" width="498" height="170" rx="12" fill="#13241c" stroke="#2d5d47" stroke-width="2"/>
<text x="614" y="136" fill="#8fe8ab" font-size="14" font-weight="800" font-family="DejaVu Sans, Arial, sans-serif">DEPOIS — escolha qualquer formato</text>
<text x="614" y="158" fill="#a8c8b6" font-size="11" font-family="DejaVu Sans, Arial, sans-serif">Clique e salve direto no formato; o selecionado fica destacado.</text>
<rect x="614" y="184" width="136" height="40" rx="7" fill="#2b2f36" stroke="#5b6472"/>
<text x="682" y="209" fill="#e7ebf2" font-size="12" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Converter .mrq</text>
<rect x="762" y="184" width="136" height="40" rx="7" fill="#e8b52d" stroke="#ffe48a" stroke-width="2"/>
<text x="830" y="209" fill="#17140a" font-size="12" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Exportar .sf2</text>
<rect x="910" y="184" width="136" height="40" rx="7" fill="#2b2f36" stroke="#5b6472"/>
<text x="978" y="209" fill="#e7ebf2" font-size="12" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Exportar .sf3</text>
<text x="614" y="252" fill="#8fe8ab" font-size="11" font-family="DejaVu Sans, Arial, sans-serif">✓ Sem obrigar dois “Salvar como”</text>

<rect x="30" y="300" width="1060" height="92" rx="10" fill="#151c26" stroke="#2b4258"/>
<circle cx="58" cy="330" r="14" fill="#54c9ef"/>
<text x="58" y="335" fill="#111318" font-size="14" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">i</text>
<text x="82" y="328" fill="#e7ebf2" font-size="12.5" font-weight="800" font-family="DejaVu Sans, Arial, sans-serif">Como funciona por trás</text>
<text x="82" y="350" fill="#c1c8d1" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">Ao escolher .sf2/.sf3 sem .mrq salvo, o app converte para um .mrq temporário, lê as amostras, monta o SoundFont e apaga o temporário.</text>
<text x="82" y="372" fill="#e8d34a" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">.sf3 continua avisando que ainda é PCM sem compressão Vorbis — o arquivo toca normalmente, mas não fica menor.</text>
</svg>
