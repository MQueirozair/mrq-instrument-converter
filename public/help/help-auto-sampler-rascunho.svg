<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="Rascunho automático e “Voltar do zero”"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8d34a"/></marker><linearGradient id="blueBar" x1="0" x2="1"><stop offset="0" stop-color="#2361ad"/><stop offset="0.5" stop-color="#2f79cf"/><stop offset="1" stop-color="#3f91e8"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#313845" stroke-width="3"/></pattern></defs><rect x="0" y="0" width="1120" height="620" rx="0" fill="#0e1014" stroke="#0e1014" stroke-width="0"/><rect x="28" y="24" width="1064" height="66" rx="12" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="50" y="52" fill="#e7ebf2" font-size="21" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Rascunho automático e “Voltar do zero”</text><text x="50" y="76" fill="#98a3b3" font-size="12.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Três comportamentos separados: clique fora não fecha, X guarda tudo, reset apaga tudo só com confirmação.</text><rect x="915" y="40" width="155" height="30" rx="15" fill="#2d2918" stroke="#e8d34a" stroke-width="1"/><text x="993" y="60" fill="#e8d34a" font-size="11" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" >SEGURANÇA</text><rect x="52" y="160" width="310" height="300" rx="14" fill="#173b4a" stroke="#54c9ef" stroke-width="2"/><text x="72" y="198" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >1. Ajustar e clicar fora</text><text x="72" y="238" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Porta MIDI, canal, notas,</text><text x="72" y="263" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >velocity, loop, ganho…</text><text x="72" y="288" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" ></text><text x="72" y="313" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Clique na área escura:</text><text x="72" y="338" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >NADA fecha ou se perde.</text><rect x="405" y="160" width="310" height="300" rx="14" fill="#173b4a" stroke="#54c9ef" stroke-width="2"/><text x="425" y="198" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >2. Fechar no X e reabrir</text><text x="425" y="238" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >O modal continua montado.</text><text x="425" y="263" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >O rascunho também fica no</text><text x="425" y="288" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >armazenamento local.</text><text x="425" y="313" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" ></text><text x="425" y="338" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Mesmo passo e mesmos valores,</text><text x="425" y="363" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >até após reiniciar o app.</text><rect x="758" y="160" width="310" height="300" rx="14" fill="#2d2118" stroke="#e8d34a" stroke-width="2"/><text x="778" y="198" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >3. Voltar do zero</text><text x="778" y="238" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Botão explícito no rodapé:</text><text x="778" y="263" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >“Limpar tudo / Voltar do zero”.</text><text x="778" y="288" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" ></text><text x="778" y="313" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Pede confirmação e apaga</text><text x="778" y="338" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >o rascunho salvo por completo.</text><line x1="365" y1="310" x2="400" y2="310" stroke="#e8d34a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="718" y1="310" x2="753" y2="310" stroke="#e8d34a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="492" width="1016" height="92" rx="12" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="76" y="522" fill="#e7ebf2" font-size="13" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >O que é preservado</text><text x="76" y="550" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Passo atual · nome · faixa de notas · velocity e divisórias · round robin · sustain/release · loop · ganho · portas/canal · testes · formatos</text><text x="76" y="570" fill="#ff6b7f" font-size="11.5" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >O que NÃO é preservado</text><text x="246" y="570" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >áudio capturado, progresso de uma captura em andamento, arquivos já exportados</text></svg>