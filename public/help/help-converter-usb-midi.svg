="1"/><rect x="334" y="224" width="18" height="92" rx="2" fill="#e9edf4" stroke="#7c8695" stroke-width="1"/><rect x="346" y="224" width="11" height="56" rx="1" fill="#171b22" stroke="#050608" stroke-width="1"/><rect x="354" y="224" width="18" height="92" rx="2" fill="#e9edf4" stroke="#7c8695" stroke-width="1"/><circle cx="144" cy="224" r="8" fill="#e8d34a"/><text x="94" y="348" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Tocar C4 (velocity 92)</text><line x1="372" y1="270" x2="450" y2="270" stroke="#e8d34a" stroke-width="3" marker-end="url(#arrow)"/><text x="411" y="250" fill="#e8d34a" font-size="11" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" >USB MIDI</text><rect x="452" y="160" width="270" height="220" rx="14" fill="#173b4a" stroke="#54c9ef" stroke-width="2"/><text x="476" y="192" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >MRQ — Conversor</text><text x="476" y="228" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >1. Porta MIDI ativa</text><text x="476" y="256" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >2. Nota recebida: C4</text><text x="476" y="284" fill="#98a3b3" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >3. Velocity: 92</text><text x="476" y="320" fill="#54c9ef" font-size="13" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >→ localiza a zona</text><line x1="724" y1="270" x2="802" y2="270" stroke="#e8d34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="160" width="250" height="220" rx="14" fill="#191d24" stroke="#343b47" stroke-width="1"/><text x="828" y="192" fill="#e7ebf2" font-size="15" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Grade de zonas</text><rect x="828" y="220" width="200" height="42" rx="5" fill="#2b6cc0" stroke="#8ab5e7" stroke-width="1"/><rect x="828" y="266" width="200" height="42" rx="5" fill="#2f79cf" stroke="#8ab5e7" stroke-width="1"/><rect x="828" y="312" width="200" height="42" rx="5" fill="#3f91e8" stroke="#8ab5e7" stroke-width="1"/><rect x="828" y="266" width="200" height="42" rx="5" fill="#e8d34a" stroke="#e8d34a" stroke-width="3"/><text x="838" y="294" fill="#111318" font-size="11" font-weight="800" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >ZONA ACESA — C4 / vel 92</text><text x="828" y="356" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >e toca a amostra</text><rect x="70" y="420" width="450" height="72" rx="10" fill="#15191f" stroke="#54c9ef" stroke-width="1.5"/><circle cx="92" cy="456.0" r="14" fill="#54c9ef"/><text x="92" y="461.0" fill="#111318" font-size="14" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" >1</text><text x="115" y="443" fill="#e7ebf2" font-size="13.5" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Configurar</text><text x="115" y="465" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Escolha a porta do controlador em “Controlador MIDI”</text><rect x="540" y="420" width="510" height="72" rx="10" fill="#15191f" stroke="#54c9ef" stroke-width="1.5"/><circle cx="562" cy="456.0" r="14" fill="#54c9ef"/><text x="562" y="461.0" fill="#111318" font-size="14" font-weight="800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" >2</text><text x="585" y="443" fill="#e7ebf2" font-size="13.5" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Pré-ouvir</text><text x="585" y="465" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Toque uma tecla: a zona correspondente acende</text><rect x="70" y="520" width="984" height="66" rx="10" fill="#20252e" stroke="#343b47" stroke-width="1"/><text x="92" y="548" fill="#e7ebf2" font-size="12.5" font-weight="700" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >Serve para conferir o mapeamento real sem precisar exportar e abrir o instrumento em outro programa.</text><text x="92" y="570" fill="#98a3b3" font-size="11.5" font-weight="400" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" >A nota e a velocity recebidas selecionam a zona na grade key × velocity.</text></svg>