name: Release (Tauri)

# Builda a casca nativa Tauri para Windows, macOS (universal) e Linux e publica
# um GitHub Release com os instaladores + o manifesto assinado do updater
# (latest.json), usado pelo tauri-plugin-updater em runtime (ver
# src-tauri/tauri.conf.json > plugins.updater.endpoints).
#
# Dispara em push de tag "v*" (ex.: v0.2.0) ou manualmente via Actions.
# O release é criado como RASCUNHO (draft) — fica invisível pro updater e
# pros usuários até alguém revisar os artefatos e publicá-lo manualmente.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Windows e macOS: usa a action oficial, que builda, assina os artefatos
  # do updater e já publica tudo (incluindo o latest.json) no release.
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache do cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: dependências do frontend
        run: npm ci

      # whisper-rs/whisper.cpp (ver src-tauri/src/speech.rs) usa bindgen, que
      # precisa achar o libclang do LLVM já pré-instalado na imagem do
      # runner Windows (em C:\Program Files\LLVM) — sem essa variável o
      # bindgen às vezes não acha o libclang sozinho e o build falha.
      - name: LIBCLANG_PATH (Windows, necessário pro build do whisper-rs)
        if: matrix.platform == 'windows-latest'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: CMAKE_TOOLCHAIN_FILE (GGML_NATIVE=OFF, build portátil do whisper-rs)
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.github/cmake/ggml-no-native.cmake" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MRQ Instrument Converter v__VERSION__'
          releaseBody: |
            ## Nesta versão

            - **Correção crítica no Auto Sampler (loopback nativo):** corrigido
              o erro `invalid args 'sampleRateHz' for command
              'mrq_builder_add_sample'` ao finalizar a gravação (`LoopbackStartInfo`
              serializado em `camelCase`).
            - **Medidor VU L/R ao vivo no loopback nativo:** as barras L/R não
              somem mais ao escolher `(loopback nativo)` nem durante a gravação
              — agora medem em tempo real o áudio que sai na saída de som do
              sistema (inclusive com `Input Gain` aplicado).
            - **Saída de som do sistema selecionada por padrão no Windows:** ao
              abrir o Auto Sampler no Windows, já seleciona automaticamente
              `Saída de som do sistema — Padrão (loopback nativo)`, sem
              depender de microfone nem de VB-Cable.
            - **Diagnóstico claro e reconexão automática para `0x8889000A`
              (Modo Exclusivo):** quando o Kontakt prende a saída de som em
              `WASAPI (Exclusive Mode)` ou `ASIO`, exibe o passo a passo exato
              para mudar para `WASAPI (Shared Mode)`, atalho direto para o
              Painel de Som do Windows (`mmsys.cpl`) e reconecta sozinho a
              cada 2s.
            - **Exportação `.sf2`/`.sf3` robusta no Windows:** gravação em
              blocos via comando nativo (`save_binary_file`), evitando falhas
              em bibliotecas grandes (ex.: `.npno`).

            **Requisitos:** macOS 10.15 (Catalina) ou mais recente, Windows
            7+, ou Linux com WebKitGTK.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Linux: builda e publica os pacotes manualmente, à parte. O tauri-action
  # tem um bug conhecido de detecção de nomes de artefato especificamente no
  # Linux quando o productName tem espaço — ele monta dois nomes candidatos
  # (nenhum bate com o nome real gerado pelo bundler) e falha o upload
  # inteiro. Builda igual, só não usa a action pra publicar: sobe os
  # pacotes brutos direto. Fica SEM o manifesto assinado do updater por
  # enquanto (usuários Linux atualizam baixando a versão nova manualmente,
  # não recebem o aviso automático de atualização).
  release-linux:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake libclang-dev

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache do cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: dependências do frontend
        run: npm ci

      - name: build do frontend
        run: npm run build

      - name: CMAKE_TOOLCHAIN_FILE (GGML_NATIVE=OFF, build portátil do whisper-rs)
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.github/cmake/ggml-no-native.cmake" >> "$GITHUB_ENV"

      - name: build + bundle (Tauri CLI direto, sem passar pela tauri-action)
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,rpm,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: publicar pacotes Linux no release (rascunho) já criado acima
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
