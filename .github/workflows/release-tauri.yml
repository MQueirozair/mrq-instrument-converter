name: Release (Tauri)

# Builda a casca nativa Tauri para Windows, macOS (universal) e Linux e publica
# um GitHub Release com os instaladores + o manifesto assinado do updater
# (latest.json), usado pelo tauri-plugin-updater em runtime (ver
# src-tauri/tauri.conf.json > plugins.updater.endpoints).
#
# Dispara em push de tag "v*" (ex.: v0.2.0) ou manualmente via Actions.
# O release é criado como RASCUNHO (draft) — fica invisível pro updater e
# pros usuários até alguém revisar os artefatos e publicá-lo manualmente.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Windows e macOS: usa a action oficial, que builda, assina os artefatos
  # do updater e já publica tudo (incluindo o latest.json) no release.
  #
  # v0.2.20: macOS em DOIS builds separados (pedido do usuário) em vez do
  # binário universal único:
  #   - `aarch64-apple-darwin` → Apple Silicon (M1/M2/M3/M4) — DMG `*_aarch64.dmg`
  #   - `x86_64-apple-darwin`  → Intel (incl. MacBook Pro com macOS 10.15
  #     Catalina) — DMG `*_x86_64.dmg`
  # Ambos com `minimumSystemVersion: 10.15` no tauri.conf.json (Catalina+).
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-15'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache do cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: dependências do frontend
        run: npm ci

      # whisper-rs/whisper.cpp (ver src-tauri/src/speech.rs) usa bindgen, que
      # precisa achar o libclang do LLVM já pré-instalado na imagem do
      # runner Windows (em C:\Program Files\LLVM) — sem essa variável o
      # bindgen às vezes não acha o libclang sozinho e o build falha.
      - name: LIBCLANG_PATH (Windows, necessário pro build do whisper-rs)
        if: matrix.platform == 'windows-latest'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: CMAKE_TOOLCHAIN_FILE (GGML_NATIVE=OFF, build portátil do whisper-rs)
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.github/cmake/ggml-no-native.cmake" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MRQ Instrument Converter v__VERSION__'
          releaseBody: |
            ## Nesta versão (v0.2.20)

            - **macOS em dois instaladores separados (pedido dos usuários):**
              agora há um `.dmg` para cada arquitetura —
              `*_x86_64.dmg` para **Mac Intel** (incluindo MacBook Pro com
              **macOS 10.15 Catalina**) e `*_aarch64.dmg` para **Apple
              Silicon (M1/M2/M3/M4)**. Baixe o da sua máquina.
            - **Instalação no macOS sem o erro "danificado" (v0.2.19):** o
              app é gerado com **assinatura ad-hoc de código** — o
              Gatekeeper não bloqueia mais como "danificado" (na primeira
              abertura o macOS pede uma confirmação — ver abaixo).
            - **Exportação SF2 sem travamento (v0.2.18):** escrita PCM em
              bloco, extração de amostras em lote com barra de progresso
              real ("128/512 amostras") e gravação em base64.

            ### Como instalar no macOS (primeira vez)

            1. Baixe o `.dmg` da **sua arquitetura**:
               - Mac **Intel** → `MRQ.Instrument.Converter_*_x86_64.dmg`
               - Mac **M1/M2/M3/M4** → `MRQ.Instrument.Converter_*_aarch64.dmg`
            2. Abra o `.dmg` e arraste **MRQ Instrument Converter** para a
               pasta **Aplicativos**.
            3. Na **primeira abertura**, o macOS mostra um aviso de que o
               app é de um desenvolvedor não identificado. Clique em
               **Cancelar**, depois **clique com o botão direito** (ou
               `Ctrl` + clique) no app em Aplicativos → **Abrir** →
               **Abrir** de novo. Depois disso ele abre direto.
            4. Alternativa pelo Terminal (se preferir):
               `xattr -cr "/Applications/MRQ Instrument Converter.app"`

            **Requisitos:** macOS **10.15 (Catalina)** ou mais recente
            (Intel e Apple Silicon), Windows 7+, ou Linux com WebKitGTK.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # v0.2.19: confere que o .app macOS saiu ASSINADO (ad-hoc, via
      # `signingIdentity: "-"` no tauri.conf.json). Sem assinatura, o
      # Gatekeeper do macOS bloqueia o app baixado como "danificado e não
      # pode ser aberto" — o erro de instalação do .dmg relatado. Roda
      # depois do build/publicação: se falhar, o job fica vermelho e o
      # rascunho não deve ser publicado.
      - name: verificar assinatura ad-hoc do app (macOS)
        if: matrix.platform == 'macos-15'
        run: |
          APP=$(find src-tauri/target -maxdepth 6 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::nenhum .app encontrado pra verificar"; exit 1; fi
          echo "App: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -5

  # Linux: builda e publica os pacotes manualmente, à parte. O tauri-action
  # tem um bug conhecido de detecção de nomes de artefato especificamente no
  # Linux quando o productName tem espaço — ele monta dois nomes candidatos
  # (nenhum bate com o nome real gerado pelo bundler) e falha o upload
  # inteiro. Builda igual, só não usa a action pra publicar: sobe os
  # pacotes brutos direto. Fica SEM o manifesto assinado do updater por
  # enquanto (usuários Linux atualizam baixando a versão nova manualmente,
  # não recebem o aviso automático de atualização).
  release-linux:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake libclang-dev

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache do cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: dependências do frontend
        run: npm ci

      - name: build do frontend
        run: npm run build

      - name: CMAKE_TOOLCHAIN_FILE (GGML_NATIVE=OFF, build portátil do whisper-rs)
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.github/cmake/ggml-no-native.cmake" >> "$GITHUB_ENV"

      - name: build + bundle (Tauri CLI direto, sem passar pela tauri-action)
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,rpm,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: publicar pacotes Linux no release (rascunho) já criado acima
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
